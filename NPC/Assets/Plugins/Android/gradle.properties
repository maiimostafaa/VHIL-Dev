# Gradle properties for Android builds
# This file helps optimize Gradle build performance and resolve common issues

# Increase memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable Gradle daemon (speeds up builds)
org.gradle.daemon=true

# Configure on demand (faster for large projects)
org.gradle.configureondemand=true

# AndroidX migration support
android.useAndroidX=true
android.enableJetifier=true

# Disable unnecessary features for faster builds
android.enableR8.fullMode=false

# Use incremental compilation
org.gradle.caching=true
